name: Release builds

# Bundled release: CI builds and ships the COMPILED game from this repo's
# committed generated/ C (psxrecomp/docs/ci/BUNDLED_RELEASES.md). Players
# download, point the launcher at their own disc dump, and play — nothing is
# generated or compiled on their machine.
#
# Artifacts per tag / dispatch:
#   dist/bh-<version>-linux-x64.zip             — the compiled game, Linux
#   dist/bh-<version>-windows-x64.zip           — the compiled game, Windows
#   dist/BattleHunter-Recompiled-v<ver>-x86_64.AppImage (+ .sha256)
#
# The matrix and every step shape are the framework template's
# (psxrecomp/docs/ci/templates/game-release.yml): windows-x64 is cut on
# windows-2022 inside an MSYS2 MinGW-w64 (MINGW64) shell, exactly like every
# other psxrecomp title — see psxrecomp/docs/ci/README.md ("Matrix"). Two
# title-specific deltas on purpose:
#   * no macOS rows yet (nobody has ever built this title on a Mac; adding a
#     row that has never been run is how a red X gets normalised),
#   * the AppImage steps stay Linux-only, because they wrap the Linux payload.
#
# The Windows zip is a MinGW build linked with PSX_STATIC_RUNTIME=ON
# (runtime.cmake's default for MinGW Release): the exe imports ONLY Windows
# system DLLs, so it runs from any folder with zero bundled DLLs and the
# 0xc000007b STATUS_INVALID_IMAGE_FORMAT crash is structurally impossible.
# "Verify the exe is self-contained" below is what keeps that true.
#
# Publish a release by pushing a tag (git tag v1.0.0 && git push origin v1.0.0)
# or via workflow_dispatch (empty version = auto-bump). The zips and the AppImage
# carry the same validated payload: executable, runtime data, bundled OpenBIOS,
# mod catalog, overlay toolchain — never sources, generated C, emitters, or dumps.
#
# Local iteration on the Windows build does not need a Windows box:
#   scripts/build_windows.sh          # cross-build + package on Linux
#   scripts/test_windows_proton.sh    # run the .exe under Valve's Proton

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (e.g. 0.1.0 or v0.1.0). Leave empty to auto-bump
          from the latest vX.Y.Z git tag (see bump).
        required: false
        type: string
        default: ''
      bump:
        description: 'When version is empty, which semver component to increment'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      publish:
        description: 'Create git tag vX.Y.Z and GitHub Release'
        required: true
        type: boolean
        default: true
      reuse_cached_emitters:
        description: 'Skip emitter rebuild when build-recompiler cache hits (psxrecomp SHA)'
        required: false
        type: boolean
        default: true
      platforms:
        description: >-
          Which artifacts to build. 'all' is what a tag push always does; one
          platform is for iterating on a single job without paying for both.
        required: false
        type: choice
        options: [all, linux-x64, windows-x64]
        default: all
  push:
    tags: ['v*']

concurrency:
  group: bh-release-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      reuse_emitters: ${{ steps.meta.outputs.reuse_emitters }}
      platforms: ${{ steps.meta.outputs.platforms }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout (tags for auto-bump)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            BUMP="${{ github.event.inputs.bump }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            REUSE="${{ github.event.inputs.reuse_cached_emitters }}"
            PLATFORMS="${{ github.event.inputs.platforms }}"
          else
            RAW="${{ github.ref_name }}"
            BUMP="patch"
            PUBLISH="true"
            REUSE="true"
            PLATFORMS="all"
          fi
          PLATFORMS="${PLATFORMS:-all}"
          RAW="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          if [[ -z "${RAW}" ]]; then
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
            BASE="${LATEST#v}"
            if [[ -z "${BASE}" && -f VERSION ]]; then
              BASE="$(tr -d '[:space:]' <VERSION)"
              BASE="${BASE#v}"
            fi
            BASE="${BASE:-0.0.0}"
            BASE="${BASE%%[-+]*}"
            IFS=. read -r MA MI PA <<<"${BASE}"
            MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
            case "${BUMP}" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *)     PA=$((PA + 1)) ;;
            esac
            VER="${MA}.${MI}.${PA}"
            TAG="v${VER}"
            echo "Auto-bumped ${BUMP}: ${LATEST:-none} → ${VER}"
          else
            VER="${RAW#v}"
            if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
              echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            TAG="v${VER}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists — bump again or pass an explicit version"
            exit 1
          fi
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >>"$GITHUB_OUTPUT"
          echo "reuse_emitters=${REUSE}" >>"$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >>"$GITHUB_OUTPUT"
          # The build matrix is built HERE, not under `build`: a job-level `if`
          # on `build` cannot see the matrix context (GitHub rejects the whole
          # workflow file for it — only github/inputs/needs/vars are allowed
          # there), so the single-platform dispatch filter rides inside the
          # matrix rows instead.
          case "${PLATFORMS}" in
            linux-x64)
              MATRIX='[{"os":"ubuntu-24.04","artifact":"linux-x64","shell":"bash"}]' ;;
            windows-x64)
              # Every step of the Windows job runs in the MSYS2 MINGW64 shell:
              # the build needs the MinGW-w64 toolchain and the /mingw64
              # prefix, absent from the runner's default Git Bash.
              MATRIX='[{"os":"windows-2022","artifact":"windows-x64","shell":"msys2 {0}"}]' ;;
            *)
              MATRIX='[{"os":"ubuntu-24.04","artifact":"linux-x64","shell":"bash"},{"os":"windows-2022","artifact":"windows-x64","shell":"msys2 {0}"}]' ;;
          esac
          echo "matrix=${MATRIX}" >>"$GITHUB_OUTPUT"
          echo "Using version ${VER} (tag ${TAG}), publish=${PUBLISH}, reuse_emitters=${REUSE}, platforms=${PLATFORMS}"

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # fromJSON: the rows (and the single-platform filter) come from prepare.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin VERSION
        shell: bash
        run: printf '%s\n' "${RELEASE_VERSION}" >VERSION

      - name: Record framework revisions
        shell: bash
        run: bash psxrecomp/tools/ci/record_pins.sh

      # game.toml, CMakeLists GEN_MARKER and codegen_setup.c each carry the
      # boot-EXE name; the committed generated/ files are named after it.
      - name: Lint boot-EXE name consistency
        shell: bash
        run: bash psxrecomp/tools/ci/check_boot_exe.sh .

      # The release is built from COMMITTED C. Fail at the top when it is
      # absent/untracked, or when a BIOS dump is in the tree.
      - name: Verify committed game C
        shell: bash
        run: bash psxrecomp/tools/ci/check_generated.sh --root .

      - name: Verify BIOS backend stamps
        shell: bash
        run: bash psxrecomp/tools/ci/check_bios_stamps.sh --framework psxrecomp

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-zlib
            python
            curl
            zip
            unzip

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # X11 + xtst required when FetchContent builds SDL3 (XTEST).
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zip unzip \
            libgl1-mesa-dev libxtst-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libudev-dev libvulkan-dev glslc xvfb

      # Headers + glslc are enough to build PSX_HAVE_VULKAN; the runtime still
      # loads the ICD dynamically through SDL. Fail early rather than ship a
      # release whose Vulkan backend silently became an inert stub.
      - name: Verify Vulkan build tools
        run: |
          set -euo pipefail
          command -v glslc
          glslc --version || true
          HDR=""
          for candidate in \
              /mingw64/include/vulkan/vulkan.h \
              /usr/include/vulkan/vulkan.h; do
            if [[ -f "${candidate}" ]]; then HDR="${candidate}"; break; fi
          done
          [[ -n "${HDR}" ]] || { echo "::error::vulkan/vulkan.h not found"; exit 1; }
          echo "Found ${HDR}"

      # Ubuntu 24.04 has no libsdl3-dev and MSYS2 ships SDL2, so CMake
      # FetchContents the pinned SDL3 tarball. CMake's own HTTP/2 download from
      # github.com release assets intermittently dies with REFUSED_STREAM, so
      # prefetch with curl --http1.1 (framework helper, repo-relative paths:
      # Windows GITHUB_WORKSPACE is D:\… and GNU tar reads a drive letter as a
      # remote host).
      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          sdl3_env() {
            local abs="${OUT}"
            if command -v cygpath >/dev/null 2>&1; then
              abs="$(cygpath -m "${OUT}")"
            elif [[ -d "${OUT}" ]]; then
              abs="$(cd "${OUT}" && pwd)"
            fi
            echo "PSX_SDL3_SOURCE_DIR=${abs}" >>"$GITHUB_ENV"
            echo "SDL3 source ready: ${abs}"
          }
          if [[ -f "${OUT}/CMakeLists.txt" ]]; then
            sdl3_env; echo "SDL3 source cache hit"; exit 0
          fi
          bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
          sdl3_env

      # Windows emitters are built with the portable llvm-mingw pack so they
      # statically link their CRT: overlay_toolchain/ ships them to the player,
      # and a psxrecomp-game.exe that needs MSYS2 DLLs would be useless there.
      # The pack is a build-machine artifact only; it never ships.
      - name: Fetch portable toolchain (Windows emitters)
        if: runner.os == 'Windows'
        uses: ./psxrecomp/.github/actions/fetch-toolchain
        with:
          artifact: ${{ matrix.artifact }}

      - name: Emitter cache key
        id: emitter_cache
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C psxrecomp rev-parse HEAD)"
          echo "key=${{ runner.os }}-${{ matrix.artifact }}-emitters-${SHA}" >>"$GITHUB_OUTPUT"
          echo "psxrecomp SHA ${SHA}"

      - name: Cache emitters (build-recompiler)
        id: cache_emitters
        uses: actions/cache@v4
        with:
          path: build-recompiler
          key: ${{ steps.emitter_cache.outputs.key }}

      - name: Build recompiler tools (emitters)
        if: >-
          steps.cache_emitters.outputs.cache-hit != 'true' ||
          needs.prepare.outputs.reuse_emitters != 'true'
        uses: ./psxrecomp/.github/actions/build-emitters

      - name: Verify emitters present
        shell: bash
        run: |
          set -euo pipefail
          test -d build-recompiler
          count="$(find build-recompiler -type f \( -name 'psxrecomp-game*' -o -name 'psxrecomp-bios*' \) | wc -l | tr -d ' ')"
          if [[ "${count}" -lt 2 ]]; then
            echo "::error::expected psxrecomp-game + psxrecomp-bios under build-recompiler (found ${count})"
            exit 1
          fi

      - name: Setup ccache (Linux)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: game-${{ matrix.artifact }}
          max-size: 2G

      - name: Configure & build the game
        run: |
          set -euo pipefail
          EXTRA=()
          IS_MINGW=0
          case "$(uname -s)" in
            MINGW*|MSYS*) IS_MINGW=1 ;;
          esac
          if [[ "${IS_MINGW}" -eq 0 ]] && command -v ccache >/dev/null 2>&1; then
            EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
            EXTRA+=("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          fi
          if [[ "${IS_MINGW}" -eq 1 ]]; then
            [[ -f /mingw64/include/vulkan/vulkan.h ]] && export VULKAN_SDK=/mingw64
            # The emitters step exported a portable llvm-mingw pack into these.
            # The runtime MUST link with MSYS2 g++ (release parity), and the
            # pack's lib/ would otherwise win -L for -static-libstdc++.
            unset PSXRECOMP_TOOLCHAIN_DIR TOOLCHAIN_DIR BPE_TOOLCHAIN_DIR RETCOMM_TOOLCHAIN_DIR || true
            unset CMAKE_PREFIX_PATH SDL3_DIR ZLIB_ROOT || true
          elif [[ -f /usr/include/vulkan/vulkan.h ]]; then
            export VULKAN_SDK=/usr
          fi
          command -v glslc >/dev/null 2>&1 && EXTRA+=("-DGLSLC_EXE=$(command -v glslc)")
          JOBS="$(nproc 2>/dev/null || echo 4)"
          if [[ -n "${PSX_SDL3_SOURCE_DIR:-}" && -f "${PSX_SDL3_SOURCE_DIR}/CMakeLists.txt" ]]; then
            EXTRA+=("-DFETCHCONTENT_SOURCE_DIR_SDL3=${PSX_SDL3_SOURCE_DIR}")
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSXRECOMP_REQUIRE_GAME_C=ON \
            -DPSXRECOMP_BIOS_STALE_FATAL=ON \
            -DPSXRECOMP_FORCE_SETUP_HOST=OFF \
            -DPSXRECOMP_ALLOW_NO_BIOS=OFF \
            -DPSX_SETUP_WIZARD=ON \
            -DPSX_GAME_VERSION="${RELEASE_VERSION}" \
            "${EXTRA[@]}" 2>&1 | tee build-ci-configure.log
          # Assert the configure took the FULL path, not the setup-host one.
          grep -q 'linking generated game C (full runtime)' build-ci-configure.log \
            || { echo "::error::CMake did not link the generated game C"; exit 1; }
          grep -qE 'BIOS backends linked: .*OpenBIOS' build-ci-configure.log \
            || { echo "::error::OpenBIOS backend not linked (stamps?)"; exit 1; }
          grep -q 'Vulkan backend: headers' build-ci-configure.log \
            || { echo "::error::Vulkan backend not enabled"; exit 1; }
          if [[ "${IS_MINGW}" -eq 1 ]]; then
            # A MinGW Release build defaults to PSX_STATIC_RUNTIME=ON. Lose it
            # and the exe starts importing libgcc_s_seh-1.dll / libstdc++-6.dll
            # again, which is how 0xc000007b reports itself on a player's PC.
            grep -q 'ZLIB static (PSX_STATIC_RUNTIME)\|PSX_STATIC_RUNTIME' build-ci-configure.log \
              || grep -q 'PSX_STATIC_RUNTIME:BOOL=ON' build-ci/CMakeCache.txt \
              || { echo "::error::MinGW build is not statically linked (PSX_STATIC_RUNTIME)"; exit 1; }
          fi
          cmake --build build-ci --target psx-runtime -j"${JOBS}"
          STAMP=""
          for cand in build-ci/psx_game_version.txt build-ci/Release/psx_game_version.txt; do
            [[ -f "${cand}" ]] && STAMP="${cand}"
          done
          [[ -z "${STAMP}" ]] && STAMP="$(find build-ci -name psx_game_version.txt -type f | head -1)"
          [[ -n "${STAMP}" ]] || { echo "::error::missing psx_game_version.txt after build"; exit 1; }
          BUILT="$(tr -d '[:space:]' <"${STAMP}")"; BUILT="${BUILT#v}"
          if [[ "${BUILT}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::version stamp ${BUILT} != RELEASE_VERSION ${RELEASE_VERSION}"
            exit 1
          fi
          echo "version stamp ok: ${BUILT}"

      - name: Package game zip
        # Windows code signing (Smart App Control / SmartScreen): the packager
        # signs the staged exe and every DLL when these secrets exist, and ships
        # unsigned with a notice when they do not. Put the certificate in the
        # repo's Actions secrets as base64 (`base64 -w0 cert.pfx`).
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/package_release.sh
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Where bundle_mingw_dlls.sh looks for a runtime DLL that the PE
            # turns out to import anyway (it must not, see the check below).
            export PSXRECOMP_RUNTIME_BIN_DIR=/mingw64/bin
          fi
          export RELEASE_VERSION
          scripts/package_release.sh build-ci "${{ matrix.artifact }}" build-recompiler
          ls -la dist/

      - name: Verify zip contents
        shell: bash
        run: |
          set -euo pipefail
          # Assert the artifact, not the intent: every rule below was once
          # "the packager does that by default" and shipped broken anyway.
          ZIP=$(ls dist/bh-*-"${{ matrix.artifact }}".zip | head -1)
          echo "checking ${ZIP}"
          LIST="$(unzip -Z1 "${ZIP}")"
          EXE='BattleHunter_Recompiled'
          [[ "${{ matrix.artifact }}" == windows-* ]] && EXE='BattleHunter_Recompiled.exe'
          # 1. It is a game: executable, bundled OpenBIOS, runtime data at the root.
          for must in "${EXE}" 'bios/openbios.bin' 'bios/OpenBIOS.LICENSE' 'game.toml' \
                      'game_options.toml' 'psx_game_version.txt' 'assets/fonts/' \
                      'assets/fonts/NOTICE.md' 'assets/img/NOTICE.md' \
                      'licenses/recomp-ui-LICENSE' 'licenses/TinyCC-LICENSE.txt' \
                      'mods/bundled/'; do
            grep -q "^${must}" <<<"${LIST}" \
              || { echo "::error::release zip lacks ${must}" >&2; exit 1; }
          done
          MANIFESTS=$(grep -c 'mods/bundled/.*/manifest\.toml' <<<"${LIST}" || true)
          if [[ "${MANIFESTS}" -lt 1 ]]; then
            echo "::error::release zip ships no mod catalog" >&2; exit 1
          fi
          # 2. It is NOT a build kit: no framework tree, CLI, emitters, sources,
          #    generated C, or title scripts at the root.
          for never in '^psxrecomp/' '^recomp-ui/' '^psxrecomp_cli.py' \
                       '^psxrecomp-game' '^psxrecomp-bios' '^generated/' '^seeds/' \
                       '^CMakeLists.txt' '^codegen_setup\.' '^src/' '^tools/' '^scripts/'; do
            grep -qE "${never}" <<<"${LIST}" \
              && { echo "::error::release zip contains build-kit content: ${never}" >&2; exit 1; } \
              || true
          done
          if grep -E '\.c$' <<<"${LIST}" | grep -qv '^overlay_toolchain/'; then
            echo "::error::release zip contains C sources outside overlay_toolchain/" >&2
            exit 1
          fi
          # 2b. Windows ships TinyCC + embedded Python inside overlay_toolchain/:
          #     without them the runtime cannot compile the overlays it streams
          #     from the player's disc, and everything stays interpreted.
          if [[ "${{ matrix.artifact }}" == windows-* ]]; then
            for must in 'overlay_toolchain/tcc/tcc.exe' 'overlay_toolchain/tcc/COPYING' \
                        'overlay_toolchain/python/python.exe' \
                        'overlay_toolchain/psxrecomp-game.exe' \
                        'overlay_toolchain/psxrecomp-bios.exe' \
                        'overlay_toolchain/compile_overlays.py'; do
              grep -qx "${must}" <<<"${LIST}" \
                || { echo "::error::windows release zip lacks ${must}" >&2; exit 1; }
            done
          fi
          # 3. No BIOS dump, disc, or memory card; the only image is OpenBIOS.
          if grep -iE '(^|/)SCPH|\.(cue|iso|img|chd|mcd|mcr)$' <<<"${LIST}" | grep -qv '\.toml$'; then
            echo "::error::release zip contains a BIOS dump, disc, or memory card" >&2; exit 1
          fi
          if grep -iE '\.bin$' <<<"${LIST}" | grep -qv '^bios/openbios.bin$'; then
            echo "::error::release zip contains a .bin other than bios/openbios.bin" >&2; exit 1
          fi
          # 4. Per-machine mod state never ships.
          if grep -q 'state\.toml' <<<"${LIST}"; then
            echo "::error::release zip contains mods/state.toml (per-machine state)" >&2; exit 1
          fi
          if grep -q 'mods/installed/' <<<"${LIST}"; then
            echo "::error::release zip contains mods/installed (per-machine installs)" >&2; exit 1
          fi
          if unzip -p "${ZIP}" 'mods/**/manifest.toml' 2>/dev/null \
               | grep -Eq '^[[:space:]]*channel[[:space:]]*=[[:space:]]*"developer"'; then
            echo "::error::release zip contains developer-channel mod packages" >&2
            exit 1
          fi
          echo "zip verified: compiled game, bundled OpenBIOS, mod catalog, no kit / dumps / dev mods"

      # A MinGW exe that imports libgcc/libstdc++/SDL is the 0xc000007b crash
      # waiting to happen on a player's machine. PSX_STATIC_RUNTIME=ON is what
      # prevents it; this proves the claim on the bytes that actually ship.
      - name: Verify the exe is self-contained (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:${PATH}"
          STAGE=dist/stage-game-windows-x64
          scripts/check_windows_pe.sh --verbose "${STAGE}/BattleHunter_Recompiled.exe"
          scripts/check_windows_pe.sh "${STAGE}/overlay_toolchain/psxrecomp-game.exe" \
                                      "${STAGE}/overlay_toolchain/psxrecomp-bios.exe" \
            || echo "note: the shipped emitters import a runtime DLL; that is allowed
                     (they run from overlay_toolchain/, which ships the DLLs)"
          # Nothing of the sort should have been staged beside the game exe.
          if compgen -G "${STAGE}/*.dll" >/dev/null; then
            echo "::error::MinGW runtime DLLs staged beside the exe: $(ls "${STAGE}"/*.dll)" >&2
            exit 1
          fi
          echo "exe imports only Windows system DLLs; no bundled runtime DLLs"

      # ---- Linux only: the one-file AppImage wraps the validated payload ----
      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: scripts/package_appimage.sh build-ci build-recompiler

      - name: Smoke-test the AppImage (fresh data dir, headless display)
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/bh-data
        run: |
          set -euo pipefail
          APP="$(ls dist/BattleHunter-Recompiled-v*-x86_64.AppImage | head -1)"
          chmod +x "${APP}"
          set +e
          xvfb-run -a timeout 25 "${APP}"
          code=$?
          set -e
          # 124 = the timeout fired with the launcher still up (expected);
          # 0 = the runtime shut down cleanly on the timeout's SIGTERM (fine
          # too — it was alive until then). Anything else is a crash.
          case "${code}" in
            124|0) ;;
            *) echo "::error::launcher exited early (${code})"; exit 1 ;;
          esac
          test -x "${XDG_DATA_HOME}/BattleHunterRecomp/BattleHunter_Recompiled" \
            || { echo "::error::AppRun did not stage the payload"; exit 1; }
          echo "AppImage smoke ok: launcher up, payload staged"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bh-${{ matrix.artifact }}
          path: |
            dist/bh-*.zip
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, build]
    # always(): a filtered run has a SKIPPED build leg, and a skipped need would
    # otherwise skip the release too, silently.
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for tagging on workflow_dispatch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten release files
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.sha256' \) \
            -exec cp -v {} dist/ \;
          ls -la dist/
          # Both platforms must be present: a Windows-only or Linux-only release
          # is a packaging bug, not a release. A deliberate single-platform
          # dispatch is not a release of that kind, so it is exempt.
          if [[ "${{ needs.prepare.outputs.platforms }}" == "all" ]]; then
            compgen -G 'dist/bh-*-linux-x64.zip'   >/dev/null || { echo "::error::no linux-x64 zip"; exit 1; }
            compgen -G 'dist/bh-*-windows-x64.zip' >/dev/null || { echo "::error::no windows-x64 zip"; exit 1; }
          else
            echo "single-platform run (${{ needs.prepare.outputs.platforms }}): not asserting both zips"
          fi

      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "Battle Hunter Recompiled ${TAG}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Battle Hunter Recompiled ${{ needs.prepare.outputs.tag }}"
          files: |
            dist/bh-*.zip
            dist/*.AppImage
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
